name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Type check, unit tests, production build, then the privacy guards:
      # manifest permissions vs. snapshot, and no network use in in-page code.
      - run: npm run check
